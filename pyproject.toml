[project]
name = "training-review"
version = "1.0.0"
description = "Weekly training review: GPS, heart-rate and attendance files checked, merged and reported, with a data-quality overview"
readme = "README.md"
license = "MIT"
authors = [{ name = "Simon Bastide", email = "simon.bastide@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pandera[pandas]>=0.35",
    "jinja2>=3.1",
    "rich>=14.0",
    "typer>=0.27",
]

[project.scripts]
review = "training_review.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # code in the docs is illustrative

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD", "RUF"]
allowed-confusables = ["×", "→"]
