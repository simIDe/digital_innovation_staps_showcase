name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov=training_review --cov-report=term-missing
      - name: Sample reports
        run: uv run review report data/samples/* || [ $? -eq 1 ]  # 1 = points to check, expected on samples
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reports
          path: reports/
